function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(S),iterations:N,hash:'SHA-256'},k,256);});}
function tryPw(pw,quiet){pw=pw.trim().toLowerCase();if(!pw)return;m.style.color='#9fd3ff';m.textContent='Unlocking...';
  derive(pw).then(function(bits){return dec(bits).then(function(buf){try{localStorage.setItem(KEY,btoa(String.fromCharCode.apply(null,new Uint8Array(bits))));}catch(e){}show(buf);});})
  .catch(function(){m.style.color='#ff8787';m.textContent=quiet?'':'Wrong password. Check for typos and try again.';});}
if(!window.crypto||!crypto.subtle){m.textContent='This browser cannot unlock the game. Open the link in Safari or Chrome.';return;}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('p').value);});
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
var frag=decodeURIComponent((location.hash||'').slice(1));
if(frag){try{history.replaceState(null,'',location.pathname);}catch(e){}tryPw(frag,true);}
else if(saved){dec(b(saved)).then(show).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});}
})();
